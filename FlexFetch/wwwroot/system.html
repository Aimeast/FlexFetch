<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System - FlexFetch</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>FlexFetch</h1>
        <nav>
            <a href="/index.html">Tasks</a>
            <a href="/system.html">System</a>
            <a href="/cookie.html">Cookies</a>
            <a href="#" id="logout-link">Logout</a>
        </nav>
    </header>
    <main>
        <div class="msg" id="msg"></div>

        <div class="card">
            <h2>System information</h2>
            <div class="kv" id="info-kv"></div>
        </div>

        <div class="card">
            <h2>Anti-detection self-check</h2>
            <div class="muted" style="margin-bottom:0.5rem">
                Probes the browser for anti-bot fingerprints (webdriver, cdc_,
                User-Agent, ...). The browser starts on first use.
            </div>
            <div class="row" style="margin-bottom:0.5rem">
                <button class="secondary" onclick="runSelfCheck()">Run self-check</button>
            </div>
            <table>
                <thead><tr><th>Vector</th><th>Result</th><th>Detail</th></tr></thead>
                <tbody id="check-tbody"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Operations</h2>
            <div class="row">
                <button class="danger" onclick="shutdown()">Graceful shutdown</button>
                <button class="secondary" onclick="upgrade(this)">Upgrade components</button>
            </div>
        </div>
    </main>

    <script>
        const msg = document.getElementById('msg');

        async function api(path, options) {
            const res = await fetch(path, options);
            if (res.status === 401) { location.href = '/index.html'; return null; }
            if (res.status === 403) { show('Admin access required'); return null; }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        let msgTimer = null;

        function show(text, ok) {
            msg.textContent = text;
            msg.className = ok ? 'msg ok' : 'msg error';
            // Clear the previous timer first: during polling (upgrade status)
            // many show() calls overlap, and stale timers would flip the bar
            // to hidden mid-update, making it (and the layout) flicker.
            if (msgTimer) clearTimeout(msgTimer);
            msgTimer = setTimeout(() => { msg.className = 'msg'; }, 4000);
        }

        async function loadInfo() {
            try {
                const info = await api('/api/system/info');
                if (!info) return;
                const kv = document.getElementById('info-kv');
                kv.innerHTML = '';
                const entries = {
                    'Version': info.version,
                    'Git log': info.gitLog || 'unknown',
                    'Built at': info.buildDateTime || 'unknown',
                    'Configuration': info.buildConfiguration || 'unknown',
                    'Started at': info.startedAt ? new Date(info.startedAt).toLocaleString() : '-',
                    'Disk free': info.diskFreeBytes != null ? formatSize(info.diskFreeBytes) : '-',
                    'Disk total': info.diskTotalBytes != null ? formatSize(info.diskTotalBytes) : '-',
                    'Concurrency limit': info.concurrencyLimit,
                    'Running tasks': info.runningTasks,
                    'Queued tasks': info.queuedTasks,
                    'yt-dlp': info.ytdlpVersion || 'not installed',
                    'deno': info.denoVersion || 'not installed',
                    'ffmpeg': info.ffmpegVersion || 'not installed',
                    'Playwright': info.playwrightVersion || 'not installed',
                    'Browser': info.browser,
                };
                for (const [k, v] of Object.entries(entries)) {
                    const div = document.createElement('div');
                    div.innerHTML = '<b>' + esc(k) + '</b><span>' + esc(String(v)) + '</span>';
                    kv.appendChild(div);
                }

                const tbody = document.getElementById('check-tbody');
                tbody.innerHTML = '';
                const checks = info.browserSelfCheck || [];
                if (!checks.length) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = '<td colspan="3" class="muted">Browser not running - run the self-check to start it.</td>';
                    tbody.appendChild(tr);
                }
                for (const r of checks) {
                    const tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + esc(r.name) + '</td>' +
                        '<td><span class="badge ' + (r.passed ? 'ok' : 'err') + '">' + (r.passed ? 'PASS' : 'FAIL') + '</span></td>' +
                        '<td class="muted">' + esc(r.detail || '') + '</td>';
                    tbody.appendChild(tr);
                }
            } catch (e) { show(e.message); }
        }

        async function runSelfCheck() {
            try {
                show('Running self-check...', true);
                const results = await api('/api/system/self-check', { method: 'POST' });
                if (!results) return;
                const tbody = document.getElementById('check-tbody');
                tbody.innerHTML = '';
                for (const r of results) {
                    const tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + esc(r.name) + '</td>' +
                        '<td><span class="badge ' + (r.passed ? 'ok' : 'err') + '">' + (r.passed ? 'PASS' : 'FAIL') + '</span></td>' +
                        '<td class="muted">' + esc(r.detail || '') + '</td>';
                    tbody.appendChild(tr);
                }
            } catch (e) { show(e.message); }
        }

        async function shutdown() {
            if (!confirm('Shut down the service?')) return;
            try {
                await api('/api/system/shutdown', { method: 'POST' });
            } catch (e) {
                // The server stops right after responding; an aborted
                // response (connection reset) is expected, not an error.
                if (!(e instanceof TypeError)) { show(e.message); return; }
            }
            show('Shutting down...', true);
            setTimeout(() => { location.href = '/index.html'; }, 800);
        }

        async function upgrade(btn) {
            if (btn.disabled) return;
            btn.disabled = true;
            show('Starting upgrade...', true);
            try {
                const res = await api('/api/system/upgrade', { method: 'POST' });
                if (!res) { btn.disabled = false; return; }
                // Poll upgrade status so the message stays visible with the
                // component currently being upgraded.
                const poll = setInterval(async () => {
                    let status;
                    try {
                        status = await api('/api/system/upgrade/status');
                    } catch (e) {
                        clearInterval(poll);
                        btn.disabled = false;
                        show(e.message);
                        return;
                    }
                    if (!status) { clearInterval(poll); btn.disabled = false; return; }
                    if (status.upgrading) {
                        show('Upgrading ' + (status.component || 'components') + '...', true);
                    } else if (status.lastError) {
                        clearInterval(poll);
                        btn.disabled = false;
                        show('Upgrade failed: ' + status.lastError);
                        loadInfo();
                    } else {
                        clearInterval(poll);
                        btn.disabled = false;
                        show('Upgrade finished', true);
                        loadInfo();
                    }
                }, 700);
            } catch (e) {
                btn.disabled = false;
                show(e.message);
            }
        }

        function formatSize(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
            return bytes.toFixed(1) + ' ' + units[i];
        }

        function esc(s) {
            return (s || '').replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        document.getElementById('logout-link').onclick = async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            location.href = '/index.html';
        };

        loadInfo();
    </script>
</body>
</html>
