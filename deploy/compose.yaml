# FlexFetch compose template. Runs the app with a persistent data volume
# plus a certificate mount. No environment variables are required for the
# container itself: /data/appsettings.json (seeded on first start) owns the
# endpoints, the proxy policy and every other tunable.
#
# The image is assembled from the pre-published output (see
# deploy/Dockerfile): run
#   dotnet publish FlexFetch/FlexFetch.csproj -c Release -o publish
# before `docker compose build` - deploy.ps1 (Mode Docker) does both steps
# automatically. Building from source inside the container is no longer
# supported: the git reference for System information cannot be captured
# without the working tree.

services:
  flexfetch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: flexfetch:latest
    container_name: flexfetch
    restart: unless-stopped
    ports:
      # Defaults from /data/appsettings.json: http 5080 (redirects to
      # https), https 5081.
      - "5080:5080"
      - "5081:5081"
    volumes:
      # /data/appsettings.json is seeded on first start and is the editable
      # configuration; it survives container recreation.
      - flexfetch-data:/data
      # Certificates for the https endpoint (see /data/appsettings.json).
      # When they cannot be used the app starts without https (http keeps
      # serving).
      - ./certs:/certs

volumes:
  flexfetch-data:
